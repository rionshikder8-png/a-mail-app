name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-mail-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  report:
    name: Report status
    if: always()
    needs: [analyze-and-test, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          {
            echo "## A-Mail Flutter CI"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Analyze & Test | ${{ needs.analyze-and-test.result }} |"
            echo "| Build Android APK | ${{ needs.build-android.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any job failed
        if: ${{ needs.analyze-and-test.result != 'success' || needs.build-android.result != 'success' }}
        run: exit 1
