name: a_mail
description: "A-Mail by Adverune — A professional Flutter-based email application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.0
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  local_auth: ^2.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  intl: ^0.20.0
  flutter_local_notifications: ^18.0.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/animations/
    - assets/logo/
